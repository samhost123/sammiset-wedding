  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

11, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d4be1b15-5aeb-4e4f-beff-e86eae1f54ae\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e7bff596-3d35-4a4a-97e2-a3ebf0b2eb69\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #EDE9DC; }\n  body { -webkit-font-smoothing: antialiased; }\n  a { color: #8A6D1F; text-decoration: none; border-bottom: 1px solid #C9A845; }\n  a:hover { color: #6B5410; border-bottom-color: #8A6D1F; }\n  @keyframes streamFlow { to { stroke-dashoffset: -26; } }\n  @keyframes packetDrift { 0% { offset-distance: 0%; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #EDE9DC; font-family: 'Cormorant Garamond', Georgia, serif; color: #4A3F2C; display: flex; justify-content: center; padding: 48px 24px 96px;\">\n  <div style=\"width: 100%; max-width: 760px; background: #F7F3E6; box-shadow: 0 2px 6px rgba(74,63,44,0.10), 0 24px 60px rgba(74,63,44,0.14); display: flex; flex-direction: column;\">\n\n    <!-- ══════════ HERO ══════════ -->\n    <section data-screen-label=\"Hero\" style=\"padding: 88px 64px 56px; display: flex; flex-direction: column; align-items: center; text-align: center;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.34em; color: #8A7A56; text-transform: uppercase;\">Registry<\u002Fdiv>\n\n      <div style=\"width: min(520px, 82vw); margin: 44px 0 8px;\">\n        <svg viewBox=\"0 0 800 400\" style=\"width: 100%; height: auto; display: block; overflow: visible;\">\n          <defs>\n            <radialGradient id=\"goldDonor\" cx=\"38%\" cy=\"32%\" r=\"80%\">\n              <stop offset=\"0%\" stop-color=\"#E9CB6A\"><\u002Fstop>\n              <stop offset=\"55%\" stop-color=\"#C9A845\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#A8842B\"><\u002Fstop>\n            <\u002FradialGradient>\n          <\u002Fdefs>\n          <!-- Roche lobes: figure-eight equipotential -->\n          <path d=\"M 400 200 C 360 110, 230 90, 165 145 C 95 205, 130 300, 225 312 C 320 324, 385 262, 400 200 C 415 155, 465 120, 525 122 C 610 125, 660 190, 630 252 C 600 314, 500 316, 448 264 C 425 241, 408 222, 400 200 Z\" fill=\"none\" stroke=\"#6B5A3B\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"><\u002Fpath>\n          <!-- L1 point -->\n          <circle cx=\"400\" cy=\"200\" r=\"5\" fill=\"#6B5A3B\"><\u002Fcircle>\n          <!-- donor star (giver) -->\n          <circle cx=\"245\" cy=\"212\" r=\"62\" fill=\"url(#goldDonor)\"><\u002Fcircle>\n          <!-- accretor (the household) -->\n          <circle cx=\"545\" cy=\"205\" r=\"30\" fill=\"none\" stroke=\"#A8842B\" stroke-width=\"2.5\"><\u002Fcircle>\n          <circle cx=\"545\" cy=\"205\" r=\"46\" fill=\"none\" stroke=\"#C9A845\" stroke-width=\"1.5\" stroke-dasharray=\"3 6\"><\u002Fcircle>\n          <circle cx=\"545\" cy=\"205\" r=\"58\" fill=\"none\" stroke=\"#C9A845\" stroke-width=\"1\" stroke-dasharray=\"2 8\"><\u002Fcircle>\n          <!-- mass stream -->\n          <path d=\"M 300 195 C 350 185, 380 192, 400 200 C 430 213, 465 226, 500 220\" fill=\"none\" stroke=\"#C9A845\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-dasharray=\"4 9\" style=\"animation: streamFlow 1.6s linear infinite;\"><\u002Fpath>\n          <!-- labels -->\n          <text x=\"245\" y=\"358\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#8A7A56\" letter-spacing=\"2\">DONOR (YOU)<\u002Ftext>\n          <text x=\"400\" y=\"176\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" fill=\"#8A7A56\">L₁<\u002Ftext>\n          <text x=\"545\" y=\"358\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\" fill=\"#8A7A56\" letter-spacing=\"2\">THE HOUSEHOLD<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; line-height: 1.7; color: #8A7A56; max-width: 460px;\">Fig. 2 — Roche-lobe overflow. When a star fills its gravitational boundary, matter streams through the inner Lagrange point onto its companion. In this system: gifts.<\u002Fdiv>\n\n      <h1 style=\"font-weight: 500; font-size: clamp(38px, 6.5vw, 56px); line-height: 1.1; margin: 44px 0 0; letter-spacing: 0.01em;\">Mass transfer, <span style=\"font-style: italic; color: #A8842B;\">formalized<\u002Fspan><\u002Fh1>\n      <p style=\"font-style: italic; font-size: 21px; margin: 16px 0 0; max-width: 480px; line-height: 1.5; color: #6B5A3B;\">We said no mass transfer was required. We stand by that. But if your Roche lobe runneth over, here is where the stream lands.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- ══════════ CHANNELS ══════════ -->\n    <section data-screen-label=\"Registry channels\" style=\"padding: 16px 64px 72px; display: flex; flex-direction: column; align-items: center;\">\n      <div style=\"width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px;\">\n        <sc-for list=\"{{ channels }}\" as=\"ch\" hint-placeholder-count=\"1\">\n          <a href=\"{{ ch.url }}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; gap: 20px; border: 1px solid #C9BC9C; border-bottom: 1px solid #C9BC9C; padding: 22px 24px; color: #4A3F2C; text-decoration: none;\" style-hover=\"border-color: #A8842B; background: rgba(201,168,69,0.08);\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A8842B; flex-shrink: 0; width: 34px;\">{{ ch.num }}<\u002Fspan>\n            <span style=\"display: flex; flex-direction: column; gap: 3px; flex: 1;\">\n              <span style=\"font-size: 22px; font-weight: 500;\">{{ ch.name }}<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A7A56;\">{{ ch.desc }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #A8842B;\">→<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n\n        <div id=\"charities\" style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 16px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 20px; padding: 0 4px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A8842B; width: 34px; flex-shrink: 0;\">02<\u002Fspan>\n            <span style=\"display: flex; flex-direction: column; gap: 3px;\">\n              <span style=\"font-size: 22px; font-weight: 500;\">Causes we love<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A7A56;\">redirect your stream to a wider system — three charities we chose<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ charities }}\" as=\"ch\" hint-placeholder-count=\"3\">\n            <a href=\"{{ ch.url }}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: center; gap: 16px; border: 1px solid #C9BC9C; padding: 16px 20px; color: #4A3F2C; text-decoration: none;\" style-hover=\"border-color: #A8842B; background: rgba(201,168,69,0.08);\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A8842B; flex-shrink: 0; width: 34px;\">{{ ch.num }}<\u002Fspan>\n              <span style=\"display: flex; flex-direction: column; gap: 2px; flex: 1;\">\n                <span style=\"font-size: 19px; font-weight: 500;\">{{ ch.name }}<\u002Fspan>\n                <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8A7A56;\">{{ ch.desc }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A8842B;\">→<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #B3A88E; text-align: center; margin-top: 8px;\">// placeholder links — point these at your fund + charities<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ══════════ FOOTER ══════════ -->\n    <section data-screen-label=\"Footer\" style=\"padding: 0 64px 88px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;\">\n      <div style=\"width: 220px; height: 1px; background: #C9BC9C;\"><\u002Fdiv>\n      <p style=\"font-style: italic; font-size: 18px; margin: 22px 0 0; max-width: 420px; line-height: 1.5; color: #6B5A3B;\">Conservation of momentum applies: whatever you give, we intend to return in dinners, favors, and decades of gratitude.<\u002Fp>\n      <p style=\"font-size: 18px; margin: 6px 0 0;\"><a href=\"Taylor &amp; Samvedh - Save the Date.html\">← Back to the save the date<\u002Fa><\u002Fp>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #B3A88E; margin-top: 26px;\">Fig. 2 rendered from first principles · Taylor &amp; Samvedh · MMXXVI<\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      channels: [\n        { num: \"01\", name: \"New home fund\", desc: \"help two bodies settle into a stable orbit — replace with fund link\", url: \"#\" },\n      ],\n      charities: [\n        { num: \"02a\", name: \"Charity one\", desc: \"replace with charity name + link\", url: \"#\" },\n        { num: \"02b\", name: \"Charity two\", desc: \"replace with charity name + link\", url: \"#\" },\n        { num: \"02c\", name: \"Charity three\", desc: \"replace with charity name + link\", url: \"#\" },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
